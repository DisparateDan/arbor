name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: plugin/package-lock.json

      - name: Install dependencies
        working-directory: plugin
        run: npm install

      - name: Type check
        working-directory: plugin
        run: npx tsc --noEmit --skipLibCheck

      - name: Run tests
        working-directory: plugin
        run: npm test

      - name: Build
        working-directory: plugin
        run: npm run build
